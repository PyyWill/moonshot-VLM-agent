<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Moonshot VLM memory system pipeline</title>
  <desc id="desc">A restrained white, grey, pink, and purple pipeline diagram showing clip segmentation, VLM-enhanced object node recognition, prompt-based memory generation, VideoGraph fusion, safety warnings, and HTML visualization.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7C53A6"/>
    </marker>
    <style>
      .bg { fill: #FCFBFD; }
      .surface { fill: #FFFFFF; stroke: #E8E2EC; stroke-width: 1.4; rx: 12; }
      .surface-soft { fill: #FBF8FC; stroke: #E8E2EC; stroke-width: 1.2; rx: 10; }
      .panel { fill: #F8F5F9; stroke: #E8E2EC; stroke-width: 1.3; rx: 14; }
      .accent-panel { fill: #FFF8FE; stroke: #EBD7EE; stroke-width: 1.5; rx: 14; }
      .graph-panel { fill: #F7F4FA; stroke: #DACCE4; stroke-width: 1.5; rx: 14; }
      .title { fill: #282A2D; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #716C76; font: 15px Arial, sans-serif; }
      .section { fill: #7C53A6; font: 700 12px Arial, sans-serif; letter-spacing: 0; }
      .main { fill: #282A2D; font: 700 18px Arial, sans-serif; }
      .body { fill: #4B4650; font: 14px Arial, sans-serif; }
      .small { fill: #716C76; font: 12.5px Arial, sans-serif; }
      .chip { fill: #F6ECF7; stroke: #EBD7EE; stroke-width: 1; rx: 13; }
      .chip-grey { fill: #F2F0F4; stroke: #E2DEE6; stroke-width: 1; rx: 13; }
      .chip-pink { fill: #F2D0F0; stroke: #D99AD5; stroke-width: 1; rx: 13; }
      .chip-purple { fill: #ECE3F5; stroke: #CDB9DF; stroke-width: 1; rx: 13; }
      .arrow { fill: none; stroke: #7C53A6; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #C9C2D2; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #D99AD5; stroke-width: 1.4; }
      .node-object { fill: #7C53A6; stroke: #68438F; stroke-width: 1.2; }
      .node-memory { fill: #F2D0F0; stroke: #D99AD5; stroke-width: 1.2; }
      .node-grey { fill: #F2F2F2; stroke: #BFC0C0; stroke-width: 1.2; }
      .node-text { fill: #FFFFFF; font: 700 12px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .node-text-dark { fill: #7C53A6; font: 700 12px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>

  <text class="title" x="58" y="58">Moonshot VLM Memory System</text>
  <text class="subtitle" x="58" y="86">From first-person assembly video to grounded object nodes, graph memory, safety warnings, and interactive HTML</text>

  <rect class="surface" x="58" y="128" width="174" height="118"/>
  <text class="section" x="84" y="158">INPUT</text>
  <text class="main" x="84" y="185">Video</text>
  <text class="body" x="84" y="213">Egocentric drone</text>
  <text class="body" x="84" y="235">assembly .mp4</text>

  <rect class="surface" x="278" y="128" width="190" height="118"/>
  <text class="section" x="304" y="158">SEGMENT</text>
  <text class="main" x="304" y="185">Fixed Clips</text>
  <text class="body" x="304" y="213">30s windows</text>
  <text class="body" x="304" y="235">15 keyframes each</text>

  <rect class="accent-panel" x="514" y="104" width="294" height="166"/>
  <text class="section" x="540" y="134">OBJECT NODE RECOGNITION</text>
  <text class="main" x="540" y="162">CV Proposals + VLM Labels</text>
  <text class="body" x="540" y="194">Foreground crop candidates</text>
  <text class="body" x="540" y="216">Clip-level candidate clustering</text>
  <text class="body" x="540" y="238">Gemini closed-set assignment</text>
  <text class="small" x="540" y="260">8 parts + Current_Assembly + Reject</text>

  <rect class="surface" x="850" y="104" width="322" height="166"/>
  <text class="section" x="876" y="134">PROMPT MEMORY</text>
  <text class="main" x="876" y="162">Clip Memory Generation</text>
  <text class="body" x="876" y="194">Ordered keyframes</text>
  <text class="body" x="876" y="216">Fine-detail evidence sheet</text>
  <text class="body" x="876" y="238">Object crops tagged as &lt;object_N&gt;</text>
  <text class="small" x="876" y="260">Outputs [f] facts and [r] reasoning</text>

  <path class="arrow" d="M232 187 L278 187"/>
  <path class="arrow" d="M468 187 L514 187"/>
  <path class="arrow" d="M808 187 L850 187"/>

  <rect class="panel" x="58" y="322" width="376" height="176"/>
  <text class="section" x="84" y="352">DOMAIN CONTEXT</text>
  <text class="main" x="84" y="380">Manual + References</text>
  <text class="body" x="84" y="412">Manual labels define the closed vocabulary.</text>
  <text class="body" x="84" y="434">Part images provide visual reference sheets.</text>
  <text class="body" x="84" y="456">Safety taxonomy is used by a separate call.</text>
  <rect class="chip" x="84" y="474" width="84" height="26"/>
  <text class="small" x="105" y="492">manual</text>
  <rect class="chip-pink" x="182" y="474" width="110" height="26"/>
  <text class="small" x="202" y="492">part images</text>
  <rect class="chip-grey" x="306" y="474" width="84" height="26"/>
  <text class="small" x="330" y="492">safety</text>

  <rect class="graph-panel" x="494" y="326" width="434" height="226"/>
  <text class="section" x="522" y="357">CUMULATIVE MEMORY</text>
  <text class="main" x="522" y="385">VideoGraph</text>

  <line class="thin" x1="604" y1="448" x2="704" y2="448"/>
  <line class="thin" x1="704" y1="448" x2="806" y2="448"/>
  <circle class="node-object" cx="604" cy="448" r="24"/>
  <text class="node-text" x="604" y="448">O</text>
  <circle class="node-memory" cx="704" cy="448" r="19"/>
  <text class="node-text-dark" x="704" y="448">F</text>
  <circle class="node-memory" cx="806" cy="448" r="19"/>
  <text class="node-text-dark" x="806" y="448">R</text>

  <text class="body" x="522" y="504">Object nodes, memory nodes, and mention edges.</text>
  <text class="small" x="522" y="526">Per memory: clip_id, timestamp, embedding, task_status=None.</text>
  <text class="small" x="522" y="546">Object crops are stored by clip for visualization.</text>

  <rect class="surface" x="980" y="326" width="238" height="128"/>
  <text class="section" x="1006" y="356">SAFETY</text>
  <text class="main" x="1006" y="384">Warnings</text>
  <text class="body" x="1006" y="416">Fast Gemini model</text>
  <text class="body" x="1006" y="438">Keyframes only, else []</text>

  <rect class="surface" x="980" y="500" width="238" height="126"/>
  <text class="section" x="1006" y="530">VISUALIZATION</text>
  <text class="main" x="1006" y="558">HTML Report</text>
  <text class="body" x="1006" y="588">Clip tabs + graph tab</text>
  <text class="body" x="1006" y="610">Hover crops and timestamps</text>

  <rect class="surface-soft" x="58" y="586" width="376" height="102"/>
  <text class="section" x="84" y="616">ARTIFACTS</text>
  <text class="main" x="84" y="644">Saved Outputs</text>
  <text class="body" x="84" y="672">graph.pkl and grounded_memory.html</text>

  <path class="soft-arrow" d="M434 410 C468 392 484 374 514 252"/>
  <path class="soft-arrow" d="M434 456 C504 486 488 506 494 506"/>
  <path class="arrow" d="M1011 270 C1011 302 792 298 744 326"/>
  <path class="arrow" d="M928 438 L980 438"/>
  <path class="arrow" d="M1099 454 L1099 500"/>
  <path class="arrow" d="M711 552 C711 608 920 566 980 566"/>
  <path class="soft-arrow" d="M494 536 C438 566 426 626 434 652"/>

  <rect class="chip-purple" x="540" y="288" width="128" height="28"/>
  <text class="small" x="562" y="307">candidate sheet</text>
  <rect class="chip-pink" x="680" y="288" width="126" height="28"/>
  <text class="small" x="700" y="307">reference sheet</text>
  <rect class="chip" x="876" y="288" width="92" height="28"/>
  <text class="small" x="897" y="307">[f] facts</text>
  <rect class="chip-purple" x="980" y="288" width="112" height="28"/>
  <text class="small" x="1000" y="307">[r] reasoning</text>
</svg>
