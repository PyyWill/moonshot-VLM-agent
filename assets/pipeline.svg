<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Moonshot VLM memory system pipeline</title>
  <desc id="desc">Input video is split into clips, converted into part nodes and prompt-based memory, merged into VideoGraph long-term memory, and rendered as an interactive HTML report.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { fill: #111827; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 16px Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .main { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .body { fill: #334155; font: 14px Arial, sans-serif; }
      .small { fill: #475569; font: 13px Arial, sans-serif; }
      .label { fill: #0f172a; font: 700 13px Arial, sans-serif; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .chip { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 1; rx: 12; }
      .chip2 { fill: #ecfdf5; stroke: #86efac; stroke-width: 1; rx: 12; }
      .chip3 { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; rx: 12; }
      .chip4 { fill: #f5e8ff; stroke: #d8b4fe; stroke-width: 1; rx: 12; }
      .memory { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; rx: 8; }
      .band { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.2; rx: 10; }
      .warn { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="56" y="56">Moonshot VLM Memory System</text>
  <text class="subtitle" x="56" y="86">Video clips to grounded part nodes, graph-based memory, safety notes, and interactive HTML</text>

  <rect class="card" x="56" y="138" width="180" height="120"/>
  <text class="main" x="82" y="173">Input Video</text>
  <text class="body" x="82" y="204">First-person drone</text>
  <text class="body" x="82" y="226">assembly video</text>
  <text class="small" x="82" y="248">RGB .mp4</text>

  <rect class="card" x="278" y="138" width="190" height="120"/>
  <text class="main" x="304" y="173">Split Clips</text>
  <text class="body" x="304" y="204">Fixed-duration clips</text>
  <text class="body" x="304" y="226">Typical: 30 seconds</text>
  <text class="small" x="304" y="248">manifest.json</text>

  <rect class="card" x="510" y="112" width="258" height="172"/>
  <text class="label" x="536" y="142">PART EXTRACTION</text>
  <text class="main" x="536" y="169">Local Part Nodes</text>
  <text class="body" x="536" y="200">15 chronological keyframes</text>
  <text class="body" x="536" y="222">Foreground mask + crops</text>
  <text class="body" x="536" y="244">SIFT / shape / color rules</text>
  <text class="body" x="536" y="266">Match docs/Part Images</text>

  <rect class="card" x="820" y="112" width="332" height="172"/>
  <text class="label" x="846" y="142">GEMINI MEMORY</text>
  <text class="main" x="846" y="169">Prompt-Based Clip Memory</text>
  <text class="body" x="846" y="200">Keyframes + fine-detail sheet</text>
  <text class="body" x="846" y="222">Object crops with &lt;object_N&gt;</text>
  <text class="body" x="846" y="244">Manual context + detector labels</text>
  <text class="body" x="846" y="266">Output [f] facts and [r] reasoning</text>

  <rect class="card" x="56" y="338" width="386" height="178"/>
  <text class="main" x="82" y="372">Domain Context</text>
  <text class="body" x="82" y="404">Manual, part images, fixed part labels,</text>
  <text class="body" x="82" y="426">safety taxonomy, and compact prompts</text>
  <text class="body" x="82" y="448">guide the VLM without adding QA logic.</text>
  <rect class="chip" x="82" y="470" width="82" height="26"/>
  <text class="small" x="103" y="488">manual</text>
  <rect class="chip2" x="178" y="470" width="104" height="26"/>
  <text class="small" x="200" y="488">part images</text>
  <rect class="chip3" x="296" y="470" width="82" height="26"/>
  <text class="small" x="319" y="488">safety</text>

  <rect class="band" x="500" y="352" width="408" height="222"/>
  <text class="main" x="528" y="385">VideoGraph Long-Term Memory</text>
  <rect class="memory" x="528" y="414" width="104" height="94"/>
  <text class="label" x="553" y="441">Object</text>
  <text class="small" x="546" y="465">8 parts</text>
  <text class="small" x="546" y="485">assembly</text>
  <rect class="memory" x="648" y="414" width="104" height="94"/>
  <text class="label" x="681" y="441">[f]</text>
  <text class="small" x="666" y="465">visible</text>
  <text class="small" x="666" y="485">facts</text>
  <rect class="memory" x="768" y="414" width="104" height="94"/>
  <text class="label" x="801" y="441">[r]</text>
  <text class="small" x="786" y="465">reasoning</text>
  <text class="small" x="786" y="485">reinforced</text>
  <text class="body" x="528" y="536">Mention edges link memory to object nodes.</text>
  <text class="small" x="528" y="556">Stored per line: clip id, timestamp, task_status=None.</text>

  <rect class="card" x="952" y="352" width="260" height="152"/>
  <text class="label" x="978" y="382">SAFETY</text>
  <text class="main" x="978" y="408">Clip Warnings</text>
  <text class="body" x="978" y="438">Fast Gemini model</text>
  <text class="body" x="978" y="460">Keyframes only</text>
  <text class="body" x="978" y="482">[S-*] or [C-*], else []</text>

  <rect class="card" x="952" y="588" width="260" height="106"/>
  <text class="main" x="978" y="622">Interactive HTML</text>
  <text class="body" x="978" y="652">Clip-by-clip memory tabs</text>
  <text class="body" x="978" y="674">Full graph tab + hover preview</text>

  <rect class="card" x="56" y="588" width="386" height="106"/>
  <text class="main" x="82" y="622">Primary Artifacts</text>
  <text class="body" x="82" y="652">runs/&lt;video_id&gt;/memory/graph.pkl</text>
  <text class="body" x="82" y="674">runs/&lt;video_id&gt;/memory/grounded_memory.html</text>

  <path class="arrow" d="M236 198 L278 198"/>
  <path class="arrow" d="M468 198 L510 198"/>
  <path class="arrow" d="M768 198 L820 198"/>
  <path class="arrow" d="M986 284 C986 322 840 322 804 352"/>
  <path class="arrow" d="M908 456 L952 456"/>
  <path class="arrow" d="M1082 504 L1082 588"/>
  <path class="soft-arrow" d="M442 426 C464 412 482 406 500 404"/>
  <path class="arrow" d="M704 574 C704 626 906 641 952 641"/>
  <path class="soft-arrow" d="M500 536 C442 572 428 614 442 640"/>

  <text class="small" x="530" y="318">Part-class object nodes</text>
  <text class="small" x="882" y="324">Prompt-generated memory</text>
</svg>
