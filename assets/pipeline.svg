<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Moonshot VLM Agent pipeline</title>
  <desc id="desc">Video clips are processed into object, episodic, and semantic memories, then retrieved for question answering.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { fill: #111827; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 16px Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .main { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .body { fill: #334155; font: 14px Arial, sans-serif; }
      .small { fill: #475569; font: 13px Arial, sans-serif; }
      .label { fill: #0f172a; font: 700 13px Arial, sans-serif; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .chip { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 1; rx: 12; }
      .chip2 { fill: #ecfdf5; stroke: #86efac; stroke-width: 1; rx: 12; }
      .chip3 { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; rx: 12; }
      .memory { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; rx: 8; }
      .band { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.2; rx: 10; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="56" y="56">Moonshot VLM Agent Processing Flow</text>
  <text class="subtitle" x="56" y="86">Input video to object-centric long-term memory to natural-language QA</text>

  <rect class="card" x="56" y="140" width="190" height="118"/>
  <text class="main" x="82" y="174">Input Video</text>
  <text class="body" x="82" y="204">Raw RGB video</text>
  <text class="body" x="82" y="226">Task or egocentric</text>
  <text class="body" x="82" y="248">recording</text>

  <rect class="card" x="296" y="140" width="190" height="118"/>
  <text class="main" x="326" y="174">Split Clips</text>
  <text class="body" x="326" y="204">Fixed interval clips</text>
  <text class="body" x="326" y="226">Default: 10 seconds</text>
  <text class="small" x="326" y="248">0.mp4, 1.mp4, ...</text>

  <rect class="card" x="536" y="120" width="250" height="158"/>
  <text class="label" x="562" y="148">M1</text>
  <text class="main" x="562" y="174">Object Extraction</text>
  <text class="body" x="562" y="204">Keyframes + SAM2 masks</text>
  <text class="body" x="562" y="226">Masked object crops</text>
  <text class="body" x="562" y="248">DINOv2 embeddings</text>
  <text class="body" x="562" y="270">Cross-clip object ReID</text>

  <rect class="card" x="846" y="120" width="306" height="158"/>
  <text class="label" x="872" y="148">M4</text>
  <text class="main" x="872" y="174">Memory Construction</text>
  <text class="body" x="872" y="204">Clip frames + object crops</text>
  <text class="body" x="872" y="226">Prompted VLM generation</text>
  <text class="body" x="872" y="248">Episodic and semantic lines</text>
  <text class="body" x="872" y="270">Refine facts and equivalence</text>

  <rect class="band" x="508" y="354" width="388" height="196"/>
  <text class="main" x="536" y="386">VideoGraph Long-Term Memory</text>
  <rect class="memory" x="536" y="410" width="104" height="88"/>
  <text class="label" x="560" y="438">Object</text>
  <text class="small" x="552" y="462">crop</text>
  <text class="small" x="552" y="482">embedding</text>
  <rect class="memory" x="654" y="410" width="104" height="88"/>
  <text class="label" x="674" y="438">Episodic</text>
  <text class="small" x="670" y="462">clip event</text>
  <text class="small" x="670" y="482">mentions</text>
  <rect class="memory" x="772" y="410" width="96" height="88"/>
  <text class="label" x="789" y="438">Semantic</text>
  <text class="small" x="792" y="462">facts</text>
  <text class="small" x="792" y="482">refined</text>
  <text class="body" x="536" y="526">Edges: mention, equivalence</text>

  <rect class="card" x="952" y="366" width="260" height="152"/>
  <text class="label" x="978" y="394">M6</text>
  <text class="main" x="978" y="420">QA Interface</text>
  <text class="body" x="978" y="450">Embed question with BGE-M3</text>
  <text class="body" x="978" y="472">Retrieve relevant memories</text>
  <text class="body" x="978" y="494">Attach object crops / frames</text>

  <rect class="card" x="952" y="590" width="260" height="92"/>
  <text class="main" x="978" y="624">Answer</text>
  <text class="body" x="978" y="654">Natural-language response</text>
  <text class="small" x="978" y="674">Grounded in retrieved memory</text>

  <rect class="card" x="56" y="354" width="382" height="158"/>
  <text class="main" x="82" y="388">Optional Prompt Context</text>
  <text class="body" x="82" y="420">Manual steps, part names, part images,</text>
  <text class="body" x="82" y="442">known object categories, safety rules,</text>
  <text class="body" x="82" y="464">or domain-specific instructions.</text>
  <rect class="chip" x="82" y="482" width="88" height="26"/>
  <text class="small" x="104" y="500">manual</text>
  <rect class="chip2" x="184" y="482" width="104" height="26"/>
  <text class="small" x="207" y="500">part images</text>
  <rect class="chip3" x="302" y="482" width="96" height="26"/>
  <text class="small" x="324" y="500">prompts</text>

  <rect class="card" x="56" y="580" width="382" height="108"/>
  <text class="main" x="82" y="614">Primary Artifacts</text>
  <text class="body" x="82" y="646">data/debug/&lt;video_id&gt;/_graph.pkl</text>
  <text class="body" x="82" y="668">debug JSON records and visualizations</text>

  <path class="arrow" d="M246 199 L296 199"/>
  <path class="arrow" d="M486 199 L536 199"/>
  <path class="arrow" d="M786 199 L846 199"/>
  <path class="arrow" d="M999 278 C999 318 820 320 780 354"/>
  <path class="arrow" d="M896 452 L952 452"/>
  <path class="arrow" d="M1082 518 L1082 590"/>
  <path class="soft-arrow" d="M438 414 C545 330 760 322 892 356"/>
  <path class="soft-arrow" d="M438 454 C606 590 819 584 952 496"/>
  <path class="soft-arrow" d="M508 512 C450 570 438 612 438 634"/>

  <text class="small" x="553" y="320">Object nodes</text>
  <text class="small" x="909" y="324">Memory nodes</text>
  <text class="small" x="802" y="586">Retrieval context</text>
</svg>
